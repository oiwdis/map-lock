name: macOS app checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-app:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the native SwiftUI app
        id: build
        run: swift build
      - name: Check palette contrast
        run: ./check-contrast.sh
      - name: Check existing app behavior
        run: |
          result=0
          for check in quiz stats speedrun account zoom move; do
            "./check-$check.sh" || result=1
          done
          exit "$result"
      - name: Capture native screens in light and dark mode
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./check-ui.sh /tmp/map-lock-ui
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        with:
          name: native-ui-previews
          path: /tmp/map-lock-ui/*.png
          if-no-files-found: ignore
